<div class="container">
    <div class="row justify-content-center">

        <div class="col-12 col-lg-8 mb-4">
            <div class="card shadow-sm">

                <div
                class="card-header d-flex justify-content-between align-items-center selectable-fix"
                (click)="open = !open"
                role="button"
                [attr.aria-expanded]="open">

                <div class="d-flex align-items-center gap-2">
                    <span class="fw-semibold" style="min-width: 220px; display: inline-block;">
                    Información del trámite
                    </span>

                    <button
                    type="button"
                    class="btn btn-secondary"
                    (click)="onEdit($event)"
                    [disabled]="isEditing || submitting">
                    Editar
                    </button>
                </div>

                <span class="caret">{{ open ? "▴" : "▾" }}</span>
                </div>

                <form
                class="card-body selectable-fix"
                [hidden]="!open"
                [formGroup]="form"
                [class.was-validated]="submitting || submittedEdit">

                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label">DNI ciudadano</label>
                        <input
                            type="text"
                            formControlName="dni"
                            class="value-box-noedit">
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label">Fecha registrada</label>
                        <input
                            type="date"
                            formControlName="fechaRegistrada"
                            [class.value-box-edit]="isEditing"
                            [class.value-box-noedit]="!isEditing">
                    </div>
                </div>

                <div style="height: 1rem;"></div>


                <div class="row g-3">
                    <div class="col-12 col-md-4">
                    <label class="form-label">Expediente</label>
                    <input
                        type="text"
                        maxlength="50"
                        formControlName="expediente"
                        [class.value-box-edit]="isEditing"
                        [class.value-box-noedit]="!isEditing">
                    </div>

                    <div class="col-12 col-md-4">
                    <label class="form-label">Entidad</label>
                    <input
                        type="text"
                        maxlength="150"
                        formControlName="entidad"
                        [class.value-box-edit]="isEditing"
                        [class.value-box-noedit]="!isEditing">
                    </div>

                </div>

                <div style="height: 1rem;"></div>

                <div class="row g-3">
                    <div class="col-12 col-md-7">
                    <label class="form-label">Asunto</label>
                    <input
                        type="text"
                        maxlength="150"
                        formControlName="asunto"
                        [class.value-box-edit]="isEditing"
                        [class.value-box-noedit]="!isEditing">
                    </div>

                    <div class="col-12 col-md-5">
                    <label class="form-label">Estado trámite</label>
                    <select
                        formControlName="estadoTramite"
                        [class.value-box-edit]="isEditing"
                        [class.value-box-noedit]="!isEditing">
                        <option value="">Seleccione...</option>
                        @for (opt of estadoTramiteOpciones; track opt.value) {
                            <option [value]="opt.value">{{ opt.label }}</option>
                        }
                    </select>
                    </div>
                </div>

                <div style="height: 1rem;"></div>

                <div class="row g-3">
                    <div class="col-12">
                    <label class="form-label">Descripción</label>
                    <textarea
                        rows="3"
                        maxlength="600"
                        formControlName="descripcion"
                        [class.value-box-edit]="isEditing"
                        [class.value-box-noedit]="!isEditing">
                    </textarea>
                    </div>
                </div>

                <div style="height: 1rem;"></div>

                <div class="row g-3">
                    <div class="col-12 col-md-4">
                    <label class="form-label">Fecha inicio</label>
                    <input
                        type="date"
                        formControlName="fechaInicio"
                        [class.value-box-edit]="isEditing"
                        [class.value-box-noedit]="!isEditing">
                    </div>

                    <div class="col-12 col-md-4">
                    <label class="form-label">Fecha vencimiento</label>
                    <input
                        type="date"
                        formControlName="fechaVencimiento"
                        [class.value-box-edit]="isEditing"
                        [class.value-box-noedit]="!isEditing">
                    </div>

                    <div class="col-12 col-md-4">
                    <label class="form-label">Fecha conclusión</label>
                    <input
                        type="date"
                        formControlName="fechaConclusion"
                        [class.value-box-edit]="isEditing"
                        [class.value-box-noedit]="!isEditing">
                    </div>
                </div>

                <div style="height: 1rem;"></div>

                <div class="row g-3">
                    <div class="col-12">
                    <label class="form-label">Observación</label>
                    <textarea
                        rows="3"
                        maxlength="600"
                        formControlName="observacion"
                        [class.value-box-edit]="isEditing"
                        [class.value-box-noedit]="!isEditing">
                    </textarea>
                    </div>
                </div>

                <div style="height: 1rem;"></div>

                <hr class="my-3">

                <div class="section-title">Información de registro</div>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                    <label class="form-label">Registrado por</label>
                    <input
                        type="text"
                        [value]="creadoPorNombre || '—'"
                        class="value-box-noedit"
                        readonly>
                    </div>

                    <div class="col-12 col-md-3">
                    <label class="form-label">DNI</label>
                    <input
                        type="text"
                        [value]="creadoPorDni || '—'"
                        class="value-box-noedit"
                        readonly>
                    </div>

                    <div class="col-12 col-md-3">
                    <label class="form-label">Fecha sistema</label>
                    <input
                        type="text"
                        [value]="fechaCreadoPor ? (fechaCreadoPor | date:'yyyy-MM-dd HH:mm') : '—'"
                        class="value-box-noedit"
                        readonly>
                    </div>
                </div>

                <div style="height: 1rem;"></div>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                    <label class="form-label">Última actualización por</label>
                    <input
                        type="text"
                        [value]="modificadoPorNombre || '—'"
                        class="value-box-noedit"
                        readonly>
                    </div>

                    <div class="col-12 col-md-3">
                    <label class="form-label">DNI</label>
                    <input
                        type="text"
                        [value]="modificadoPorDni || '—'"
                        class="value-box-noedit"
                        readonly>
                    </div>

                    <div class="col-12 col-md-3">
                    <label class="form-label">Fecha sistema</label>
                    <input
                        type="text"
                        [value]="fechaModificadoPor ? (fechaModificadoPor | date:'yyyy-MM-dd HH:mm') : '—'"
                        class="value-box-noedit"
                        readonly>
                    </div>
                </div>

                <div style="height: 1rem;"></div>

                @if (isEditing) {
                    <div class="d-flex justify-content-between mt-4">
                    <button
                        type="button"
                        class="btn btn-warning"
                        (click)="onCancel()"
                        [disabled]="submitting">
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-success"
                        (click)="onSave()"
                        [disabled]="submitting">
                        @if (submitting) {
                        Guardando…
                        } @else {
                        Guardar
                        }
                    </button>
                    </div>
                }

                </form>
            </div>
        </div>
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm">

                <div
                class="card-header d-flex justify-content-between align-items-center selectable-fix"
                (click)="openDocumentos = !openDocumentos"
                role="button"
                [attr.aria-expanded]="openDocumentos">

                <div class="d-flex align-items-center gap-2">
                    <span class="fw-semibold" style="min-width: 220px; display: inline-block;">
                    Documentos
                    </span>
                </div>

                <span class="caret">{{ openDocumentos ? "▴" : "▾" }}</span>
                </div>

                <app-documentos-lista-entidad
                [entidadTipo]="'TRAMITE'"
                [entidadId]="idtramite"
                titulo="Documentos asociados al trámite."
                [hidden]="!openDocumentos">
                </app-documentos-lista-entidad>

            </div>
        </div>
    </div>
</div>
